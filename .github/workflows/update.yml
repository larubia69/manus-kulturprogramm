
name: Manus Kulturprogramm Termine aktualisieren

on:
  schedule:
    - cron: '21 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - run: python scraper.py

      - name: Neue Veranstaltungsdaten speichern
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add events.json
          git diff --cached --quiet || (git commit -m 'Veranstaltungen aktualisieren' && git push)
