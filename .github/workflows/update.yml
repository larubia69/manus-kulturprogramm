name: Manus Kulturprogramm Termine aktualisieren

on:
  schedule:
    - cron: '21 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Bestehende Veranstaltungsquellen abrufen
        run: python scraper.py
      - name: Weitere Veranstalter ergänzen
        if: ${{ hashFiles('extra_import.py') != '' }}
        run: python extra_import.py
      - name: Birkenried ergänzen
        if: ${{ hashFiles('birkenried_import.py') != '' }}
        run: python birkenried_import.py
      - name: Kino Mephisto und Obscura abrufen
        run: python cinema_import.py
      - name: Rubriken und Dubletten optimieren
        run: python normalize_events.py
      - name: Neue Veranstaltungsdaten speichern
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add events.json
          git diff --cached --quiet || (git commit -m 'Veranstaltungen aktualisieren' && git push)
